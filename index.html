<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entropy Market Intelligence — V2</title><style>
:root{color-scheme:dark;--bg:#080c19;--panel:#121a2d;--border:#283550;--muted:#a4b1c9;--ink:#f3f7ff;--teal:#78eed4;--pink:#ff9cae}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#172548,#080c19 63%);font-family:Inter,system-ui,Segoe UI,sans-serif;color:var(--ink)}main{max-width:1240px;margin:auto;padding:35px 23px 65px}.top{display:flex;gap:20px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--teal);font-weight:800}h1{font-size:clamp(29px,4vw,45px);letter-spacing:-.04em;margin:10px 0}.sub,.hint{color:var(--muted);line-height:1.6;font-size:14px;max-width:770px}.headright{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.badge{border:1px solid var(--border);border-radius:25px;padding:8px 12px;color:var(--muted);font-size:12px}.controls{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 17px}button,.filelabel,select{border:1px solid #40506c;border-radius:10px;background:#1b2946;color:var(--ink);padding:11px 14px;font-size:13px;font-weight:700;cursor:pointer}button:hover,.filelabel:hover,select:hover{border-color:var(--teal)}button.primary{background:var(--teal);color:#071827;border:0}button:disabled{opacity:.4;cursor:not-allowed}input[type=file]{display:none}.status{background:#131d33;border:1px solid var(--border);border-radius:12px;padding:14px 16px;font-size:13px;line-height:1.5}.status.ok{color:#b4ffeb;border-color:#376c60}.status.error{color:#ffc7d1;border-color:#935065}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:18px 0}.card,.panel{background:rgba(18,26,45,.94);border:1px solid var(--border);border-radius:15px}.card{padding:18px}.card span{display:block;color:var(--muted);font-size:12px}.card strong{display:block;font-size:clamp(21px,2vw,29px);margin-top:11px}.panel{padding:20px;margin-top:18px}.panelhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;margin-bottom:17px}h2{font-size:19px;margin:0}.inputrow{display:flex;gap:10px;flex-wrap:wrap}input[type=search]{border:1px solid #40506c;border-radius:9px;background:#0c1426;color:white;padding:10px 12px;font-size:13px;min-width:180px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th{text-align:right;font-size:11px;color:#afbed6;padding:13px 11px;border-bottom:1px solid #364361}th:first-child,td:first-child{text-align:left}td{text-align:right;padding:13px 11px;font-size:13px;font-variant-numeric:tabular-nums;border-bottom:1px solid #263149}tbody tr:hover{background:#1b2843}.green{color:#63ebc5}.red{color:#ff9aaf}.empty{text-align:center;color:var(--muted);padding:25px}.chart{display:grid;gap:11px}.barrow{display:grid;grid-template-columns:82px 1fr 105px;align-items:center;gap:12px;font-size:12px}.bartrack{height:13px;background:#0b1325;border-radius:9px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#378be2,#6af1d2);border-radius:9px}.notice{font-size:12px;line-height:1.8;color:var(--muted);margin:24px 0}.notice a{color:#83e6eb}.pill{border-radius:8px;padding:4px 9px;background:#183448;color:#7debd4;font-weight:700;font-size:11px}@media(max-width:780px){.cards{grid-template-columns:repeat(2,1fr)}.panel{padding:13px}}@media(max-width:480px){.card{padding:13px}.barrow{grid-template-columns:60px 1fr 75px}}
</style></head><body><main><header class="top"><div><div class="eyebrow">HIP-3 / ENTROPY.IO / io</div><h1>Entropy Market Intelligence <span class="pill">V2</span></h1><div class="sub" data-t="sub"></div></div><div class="headright"><label for="lang" data-t="language"></label><select id="lang" aria-label="Language"><option value="en">English</option><option value="fr">Français</option></select><span class="badge" id="stamp"></span></div></header><div class="controls"><button class="primary" id="refresh" data-t="refresh"></button><label class="filelabel" for="upload" data-t="import"></label><input id="upload" type="file" accept=".json,application/json"><button id="export" disabled data-t="export"></button><button id="instructions" data-t="instructions"></button></div><div id="status" class="status" role="status" aria-live="polite"></div><section class="cards"><div class="card"><span data-t="count"></span><strong id="countValue">—</strong></div><div class="card"><span data-t="oi"></span><strong id="oiValue">—</strong></div><div class="card"><span data-t="vol"></span><strong id="volValue">—</strong></div><div class="card"><span data-t="median"></span><strong id="medianValue">—</strong></div></section><section class="panel"><div class="panelhead"><h2 data-t="comparison"></h2><div class="inputrow"><input type="search" id="search" data-ph="search"><select id="sort"><option value="volume" data-t="sortVol"></option><option value="oi" data-t="sortOI"></option><option value="fundDesc" data-t="sortPositive"></option><option value="fundAsc" data-t="sortNegative"></option><option value="absFunding" data-t="sortAbs"></option><option value="name" data-t="sortName"></option></select></div></div><div class="tablewrap"><table><thead><tr><th data-t="market"></th><th data-t="mark"></th><th data-t="rate"></th><th data-t="projection"></th><th data-t="oiCol"></th><th data-t="volumeCol"></th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="panel"><div class="panelhead"><h2 data-t="top"></h2><span class="hint" data-t="topHint"></span></div><div class="chart" id="chart"></div></section><footer class="notice"><strong data-t="disclaimer"></strong> <span data-t="explanation"></span><p><span data-t="fundingNote"></span></p><span data-t="sources"></span> <a href="https://hyperliquid.gitbook.io/hyperliquid-docs/for-developers/api/info-endpoint/perpetuals" target="_blank" rel="noopener">Hyperliquid API docs</a> · <a href="https://api.hyperliquid.xyz/info" target="_blank" rel="noopener">/info endpoint</a></footer></main><script>
'use strict';
const D={en:{sub:'Live market dashboard for Entropy HIP-3 perpetuals: hourly funding rates, 24h volume, and estimated open interest. Public Hyperliquid API; no wallet connection.',language:'Language',refresh:'↻ Refresh markets',import:'Import JSON',export:'Export CSV',instructions:'Download JSON instructions',count:'Markets loaded',oi:'Estimated open interest · USD',vol:'24h volume · USD',median:'Median funding · %/h',comparison:'Market comparison',search:'Search ticker',sortVol:'Sort: 24h volume',sortOI:'Sort: open interest',sortPositive:'Sort: highest funding first',sortNegative:'Sort: lowest funding first',sortAbs:'Sort: absolute funding',sortName:'Sort: ticker',market:'Market',mark:'Mark price*',rate:'Funding %/h',projection:'24h projection**',oiCol:'Open interest USD*',volumeCol:'24h volume USD',top:'Top 8 — 24h volume',topHint:'Loaded Entropy markets',disclaimer:'Important:',explanation:'Funding is an indicative current hourly rate. Positive rates normally mean longs pay shorts; negative rates mean shorts pay longs. The 24h projection assumes an unchanged rate and is not a realized return or historical average. Estimated open interest = openInterest × markPx; valuation-linked instruments may use different units from share prices.',fundingNote:'This tool does not measure order book depth, spreads, execution fees, slippage, price divergence or liquidation risk. It does not recommend trades.',sources:'Sources:',notLoaded:'No data loaded',initial:'Click “Refresh markets” to query the Hyperliquid public API. If the browser blocks the call, import a raw metaAndAssetCtxs JSON response for dex io.',loading:'Connecting to Hyperliquid API…',loaded:'Loaded {n} Entropy markets from Hyperliquid. Retrieved: {date}.',error:'Unable to fetch live data: {error}. You may import a metaAndAssetCtxs JSON response for dex io. Previous data, if any, remains visible.',imported:'Imported {n} markets. Collection time of imported data is not independently verified.',importError:'JSON import failed: {error}',noMatch:'No matching tickers',emptyChart:'Load markets to see the chart.',importStamp:'JSON import',apiStamp:'API',downloadStamp:'Not loaded'},fr:{sub:'Tableau de bord en direct des perpétuels HIP-3 Entropy : funding horaire, volume sur 24 h et open interest estimé. API publique Hyperliquid ; aucune connexion de wallet.',language:'Langue',refresh:'↻ Actualiser les marchés',import:'Importer JSON',export:'Exporter CSV',instructions:'Instructions JSON',count:'Marchés chargés',oi:'Open interest estimé · USD',vol:'Volume 24 h · USD',median:'Funding médian · %/h',comparison:'Comparaison des marchés',search:'Rechercher un ticker',sortVol:'Trier : volume 24 h',sortOI:'Trier : open interest',sortPositive:'Trier : funding le plus positif',sortNegative:'Trier : funding le plus négatif',sortAbs:'Trier : valeur absolue du funding',sortName:'Trier : ticker',market:'Marché',mark:'Mark price*',rate:'Funding %/h',projection:'Projection 24 h**',oiCol:'Open interest USD*',volumeCol:'Volume 24 h USD',top:'Top 8 — Volume 24 h',topHint:'Marchés Entropy chargés',disclaimer:'Précisions importantes :',explanation:'Le funding est un taux horaire courant indicatif. Un taux positif signifie normalement que les longs paient les shorts, un taux négatif l’inverse. La projection 24 h suppose un taux constant : ce n’est ni un rendement réalisé, ni une moyenne historique. L’open interest estimé = openInterest × markPx ; les instruments liés à une valorisation peuvent employer des unités différentes d’un prix par action.',fundingNote:'L’outil ne mesure ni profondeur de carnet, ni spread, ni frais, ni slippage, ni écarts de prix ou risques de liquidation. Il ne recommande aucun trade.',sources:'Sources :',notLoaded:'Aucune donnée chargée',initial:'Cliquez sur « Actualiser les marchés » pour interroger l’API publique Hyperliquid. Si le navigateur bloque l’appel, importez une réponse JSON metaAndAssetCtxs pour le dex io.',loading:'Connexion à l’API Hyperliquid…',loaded:'{n} marchés Entropy chargés depuis Hyperliquid. Récupération : {date}.',error:'Échec de récupération : {error}. Vous pouvez importer une réponse JSON metaAndAssetCtxs du dex io. Les anciennes données restent visibles.',imported:'{n} marchés importés. La date de collecte des données importées n’est pas vérifiable indépendamment.',importError:'Import JSON impossible : {error}',noMatch:'Aucun ticker correspondant',emptyChart:'Chargez les marchés pour afficher le graphique.',importStamp:'Import JSON',apiStamp:'API',downloadStamp:'Non chargé'}};
const $=id=>document.getElementById(id);let lang='en',records=[],source='',loadedAt='',statusKey='initial',statusVars={},statusKind='',busy=false;const tr=(k,v={})=>D[lang][k].replace(/\{(\w+)\}/g,(_,x)=>v[x]??'');const val=x=>{const n=Number(x);return x==null||x===''||!Number.isFinite(n)?NaN:n};const fmt=(n,d=4)=>Number.isFinite(n)?new Intl.NumberFormat(lang==='fr'?'fr-FR':'en-US',{maximumFractionDigits:d,minimumFractionDigits:d}).format(n):'—';const compact=n=>Number.isFinite(n)?new Intl.NumberFormat('en-US',{notation:'compact',maximumFractionDigits:2}).format(n):'—';
function status(key,kind='',vars={}){statusKey=key;statusKind=kind;statusVars=vars;const el=$('status');el.textContent=tr(key,vars);el.className='status '+kind}
function translate(){document.documentElement.lang=lang;document.querySelectorAll('[data-t]').forEach(el=>el.textContent=tr(el.dataset.t));document.querySelectorAll('[data-ph]').forEach(el=>el.placeholder=tr(el.dataset.ph));status(statusKey,statusKind,statusVars);render()}
function parsePayload(payload){if(!Array.isArray(payload)||payload.length!==2||!Array.isArray(payload[0]?.universe)||!Array.isArray(payload[1]))throw Error('Expected [ { universe: [...] }, [asset contexts...] ]');const u=payload[0].universe,c=payload[1];if(u.length!==c.length)throw Error('Universe and asset contexts differ in length');return u.map((x,i)=>{const a=c[i]||{};const mark=val(a.markPx),base=val(a.openInterest),raw=val(a.funding);return {name:String(x.name||''),mark,oi:(mark>=0&&base>=0)?mark*base:NaN,volume:val(a.dayNtlVlm),fund:raw*100,absFunding:Math.abs(raw*100),projection:raw*2400}}).filter(x=>x.name).map(x=>({...x,name:x.name.startsWith('io:')?x.name:'io:'+x.name}));}
function addCell(row,value,cls=''){const cell=document.createElement('td');cell.textContent=value;cell.className=cls;row.append(cell)}
function render(){const list=records;const sum=k=>list.reduce((acc,r)=>acc+(Number.isFinite(r[k])?r[k]:0),0);$('countValue').textContent=list.length||'—';$('oiValue').textContent=list.length?'$'+compact(sum('oi')):'—';$('volValue').textContent=list.length?'$'+compact(sum('volume')):'—';const fs=list.map(r=>r.fund).filter(Number.isFinite).sort((a,b)=>a-b);$('medianValue').textContent=fs.length?fmt(fs.length%2?fs[(fs.length-1)/2]:(fs[fs.length/2-1]+fs[fs.length/2])/2,5):'—';$('stamp').textContent=loadedAt?tr(source==='api'?'apiStamp':'importStamp')+' · '+loadedAt:tr('notLoaded');$('export').disabled=!list.length;
const needle=$('search').value.toLowerCase().trim(),sort=$('sort').value;const view=list.filter(r=>r.name.toLowerCase().includes(needle)).sort((a,b)=>sort==='name'?a.name.localeCompare(b.name):sort==='fundAsc'?(Number.isFinite(a.fund)?a.fund:Infinity)-(Number.isFinite(b.fund)?b.fund:Infinity):sort==='fundDesc'?(Number.isFinite(b.fund)?b.fund:-Infinity)-(Number.isFinite(a.fund)?a.fund:-Infinity):(Number.isFinite(b[sort])?b[sort]:-Infinity)-(Number.isFinite(a[sort])?a[sort]:-Infinity));const tbody=$('rows');tbody.replaceChildren();if(!view.length){const row=document.createElement('tr');addCell(row,list.length?tr('noMatch'):tr('notLoaded'),'empty');row.firstChild.colSpan=6;tbody.append(row)}for(const r of view){const row=document.createElement('tr');addCell(row,r.name);addCell(row,fmt(r.mark,5));addCell(row,Number.isFinite(r.fund)?fmt(r.fund,5)+' %':'—',r.fund>0?'green':r.fund<0?'red':'');addCell(row,Number.isFinite(r.projection)?fmt(r.projection,3)+' %':'—');addCell(row,Number.isFinite(r.oi)?'$'+compact(r.oi):'—');addCell(row,Number.isFinite(r.volume)?'$'+compact(r.volume):'—');tbody.append(row)}const chart=$('chart');chart.replaceChildren();const top=list.filter(r=>Number.isFinite(r.volume)&&r.volume>=0).sort((a,b)=>b.volume-a.volume).slice(0,8);if(!top.length){const e=document.createElement('div');e.className='empty';e.textContent=tr('emptyChart');chart.append(e)}const max=top[0]?.volume||1;for(const r of top){const row=document.createElement('div');row.className='barrow';const name=document.createElement('strong');name.textContent=r.name.replace(/^io:/,'');const track=document.createElement('div');track.className='bartrack';const bar=document.createElement('div');bar.className='bar';bar.style.width=Math.max(0,100*r.volume/max)+'%';track.append(bar);const v=document.createElement('span');v.textContent='$'+compact(r.volume);v.style.textAlign='right';row.append(name,track,v);chart.append(row)}}
$('lang').addEventListener('change',e=>{lang=e.target.value;translate()});$('search').addEventListener('input',render);$('sort').addEventListener('change',render);
$('refresh').addEventListener('click',async()=>{if(busy)return;busy=true;$('refresh').disabled=true;status('loading');try{const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),12000);let response;try{response=await fetch('https://api.hyperliquid.xyz/info',{method:'POST',mode:'cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'metaAndAssetCtxs',dex:'io'}),signal:controller.signal})}finally{clearTimeout(timeout)}if(!response.ok)throw Error('HTTP '+response.status);const parsed=parsePayload(await response.json());if(!parsed.length)throw Error('No Entropy markets returned');records=parsed;source='api';loadedAt=new Date().toLocaleString(lang==='fr'?'fr-FR':'en-GB');status('loaded','ok',{n:parsed.length,date:loadedAt});render()}catch(error){status('error','error',{error:error.message})}finally{busy=false;$('refresh').disabled=false}});
$('upload').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const parsed=parsePayload(JSON.parse(await file.text()));if(!parsed.length)throw Error('Empty market list');records=parsed;source='import';loadedAt=new Date().toLocaleString(lang==='fr'?'fr-FR':'en-GB');status('imported','ok',{n:records.length});render()}catch(error){status('importError','error',{error:error.message})}finally{e.target.value=''}});
function download(name,data,type){const blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('export').addEventListener('click',()=>{const entries=[['market','mark_price','funding_percent_per_hour','funding_percent_24h_constant_rate_projection','estimated_open_interest_usd','volume_24h_usd'],...records.map(r=>[r.name,r.mark,r.fund,r.projection,r.oi,r.volume])];download('entropy_markets_'+new Date().toISOString().slice(0,10)+'.csv',entries.map(row=>row.join(',')).join('\n'),'text/csv;charset=utf-8')});
$('instructions').addEventListener('click',()=>download('entropy_json_import_instructions.txt','POST https://api.hyperliquid.xyz/info\nBody: {"type":"metaAndAssetCtxs","dex":"io"}\nSave the complete JSON response ([meta, contexts]) to a file and import it in this dashboard.\nDo not submit wallet keys or connect wallets.\n','text/plain;charset=utf-8'));
translate();
</script></body></html>
